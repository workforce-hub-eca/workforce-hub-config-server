spring:
  data:
    mongodb:
      uri: ${DOCUMENT_MONGODB_URI:mongodb://localhost:27017/workforce_document_db}
      auto-index-creation: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${DOCUMENT_EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health
