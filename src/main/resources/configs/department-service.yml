spring:
  datasource:
    url: ${DEPARTMENT_DB_URL:jdbc:mysql://localhost:3306/workforce_department_db?createDatabaseIfNotExist=true}
    username: ${DEPARTMENT_DB_USERNAME:root}
    password: ${DEPARTMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${DEPARTMENT_EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health
