spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/workforce_employee_db?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:Manu2006}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://10.0.0.12:8761/eureka/}
